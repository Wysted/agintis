# Individual dictamenes published as "Nota Interna N° <n>, del <fecha>" (117 rows,
# index doc_type=guia_faq, section "Libro de Jurisprudencia de la SP", 2021-2024).
# NOT SAMPLED: structure unknown. Draft profile = conservative generic legal-opinion
# layout; validate on 3-5 downloaded notes before ingesting (see DESIGN.md, next steps).
key: spensiones_jurisprudencia_nota
schema_version: 1
status: draft               # loads and validates, but the profile router never selects it
routing:
  - match: {doc_type: [guia_faq, articulo_html], title: {regex: '^\s*Nota Interna'}}
    priority: 10     # narrower than the generic article rule of articulo_faq
top_k: 5
chunk_max_tokens: 600
parser_key: simple              # scanned notes would need `ocr_index_card` (`ocr` extra)
cleaners:
  - key: strip_repeated_page_lines
    params: {zone_lines_top: 3, zone_lines_bottom: 3, min_page_ratio: 0.5, min_pages: 2, normalize_digits: true}
  - key: strip_lines
    params: {patterns: ['^\s*\d{1,3}\s*$']}
  - key: normalize_whitespace
    params: {collapse_inner_spaces: true, strip_lines: true, max_blank_lines: 1}
chunker_key: pattern_hierarchy
chunker_params:
  levels:
    - name: seccion
      depth: 0
      # Typical dictamen blocks; unvalidated guesses, upper-case only.
      pattern: '^(?P<seccion>ANTECEDENTES|CONSULTA|AN[AÁ]LISIS|CONCLUSI[OÓ]N(?:ES)?|PRONUNCIAMIENTO|MATERIA|REF\.?)\s*:?\s*$'
      heading_template: '{seccion}'
    - name: numero
      depth: 1
      pattern: '^(?P<numero>\d{1,2})\.-?(?!\d)\s+\S'
      heading_template: '{numero}.'
  split_level: numero
  oversize: {strategy: deeper_levels_then_recursive, levels: []}
  merge_below_tokens: 80
  include_heading: true
  heading_prefix_template: 'Dictamen {title:70}'
  preamble: keep
  preamble_heading: 'Encabezado'
extractors:
  legal_refs:
    # Chilean legal references in the chunk: "D.L. N° 3.500" -> "DL 3500", "Ley N° 21.735" -> "Ley 21735".
    key: regex_labeled
    params:
      rules:
        - {pattern: '\bD\.\s?L\.\s*N[°º]\s*([\d.]+)', label: DL, strip_chars: '.'}
        - {pattern: '\bDecreto\s+Ley\s+N[°º]\s*([\d.]+)', label: DL, strip_chars: '.'}
        - {pattern: '\bD\.\s?F\.\s?L\.\s*N[°º]\s*([\d.]+)', label: DFL, strip_chars: '.'}
        - {pattern: '\bD\.\s?S\.(?:\s+conjunto)?\s+N[°º]\s*(\d+)', label: DS}
        # Not the tail of "Decreto Ley N° 3.500" (that is a DL, already matched above).
        - {pattern: '(?<!Decreto )\b[Ll]ey\s+N[°º]\s*([\d.]+)', label: Ley, strip_chars: '.'}
metadata_fields:
  - {name: source_id,    type: str,  source: 'document:id',            filterable: true}
  - {name: doc_family,   type: str,  source: 'const:jurisprudencia',   filterable: true}
  - {name: nota_number,  type: int,  source: 'document:number',        filterable: true, indexed: true}
  - name: issued_date
    type: date
    source: 'document:date'
    transforms: [{key: date_floor}, {key: reject_after, params: {limit: ingest_date}}]
    filterable: true
    indexed: true
  - name: audiences
    type: 'list[str]'
    source: 'document:section'
    transforms: [{key: path_segment, params: {take: last}}]
    filterable: true
  - {name: cited_laws,   type: 'list[str]', source: 'extractor:legal_refs', filterable: true}
default_filter: null
reranker_key: none
