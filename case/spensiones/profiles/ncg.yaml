# Normas de Caracter General (index doc_type=ncg, 485 rows, 2011-2026; 442 titles say
# "MODIFICA ..."). Most NCGs are amendment instruments over the Compendio:
#   I. Introdúcense las siguientes modificaciones al Título I ..., del Libro III:   (parte)
#   A. Reemplácese, en el número 6.1 del Capítulo II de la Letra D.1 ...            (enmienda)
#   a) Agrégase en el número 2, a continuación de la letra e), ...                  (operacion)
#   “<new text inserted into the Compendio>”   (can be a whole new Capítulo with its own 1., a))
#   II. VIGENCIA
# Validated against samples/ncg/ncg-sp-372.txt.
key: spensiones_ncg
schema_version: 1
routing:
  - match: {doc_type: [ncg]}
top_k: 6
chunk_max_tokens: 700
parser_key: simple
cleaners:
  - key: strip_repeated_page_lines
    params: {zone_lines_top: 3, zone_lines_bottom: 3, min_page_ratio: 0.5, min_pages: 2, normalize_digits: true}
  - key: strip_lines
    params:
      patterns:
        - '^\s*\d{1,3}\s*$'
        - '^Verifique documento en https?://\S+$'
        - '^_{5,}\s*$'
        - '^[A-Z]{2}-[A-Z]{3}-\d{2}-\d{1,3}\s*$'      # internal id echoed in the page-1 footer
  - key: normalize_quotes
    # Inserted Compendio text is delimited by typographic quotes; legacy files mix in
    # ASCII quotes and «». Normalise to “ ” so span protection works.
    params: {map: {'«': '“', '»': '”', '„': '“'}, ascii_double: alternate}  # ASCII " -> “ / ” by parity
  - key: normalize_whitespace
    params: {collapse_inner_spaces: true, strip_lines: true, max_blank_lines: 1}
chunker_key: pattern_hierarchy
chunker_params:
  # Level markers inside quoted inserted text belong to the Compendio, not to the NCG.
  ignore_inside: [{open: '“', close: '”', nesting: true, max_span_chars: 60000}]  # quotes nest: “… “Selección de Modalidad” …”
  levels:
    - name: parte
      depth: 0
      pattern: '^(?P<parte>[IVX]{1,4})\.\s+(?P<parte_head>\S.*)$'
      heading_template: '{parte}. {parte_head:50}'
    - name: enmienda
      depth: 1
      pattern: '^(?P<enmienda>[A-Z])\.\s+(?:(?P<op_verb>(?:Reempl[aá]c|Reempl[aá]z|Modif[ií]qu|Modif[ií]c|Agr[eé]g|Elim[ií]n|Incorp[oó]r|Sustit[uú]y|Interc[aá]l|Der[oó]g|Introd[uú]c|Supr[ií]m|Rectif[ií]qu|Rectif[ií]c|Renumer|Reenumer)[a-záéíóú]*se)\b,?\s*)?(?P<enmienda_head>.*)$'
      heading_template: '{enmienda}. {op_verb?{op_verb} }{enmienda_head:100}'
    - name: operacion
      depth: 2
      pattern: '^(?P<operacion>[a-z])\)\s+(?:(?P<op_verb>(?:Reempl[aá]c|Reempl[aá]z|Modif[ií]qu|Modif[ií]c|Agr[eé]g|Elim[ií]n|Incorp[oó]r|Sustit[uú]y|Interc[aá]l|Der[oó]g|Introd[uú]c|Supr[ií]m|Rectif[ií]qu|Rectif[ií]c|Renumer|Reenumer)[a-záéíóú]*se)\b,?\s*)?(?P<operacion_head>.*)$'
      heading_template: '{operacion}) {op_verb?{op_verb} }{operacion_head:80}'
  split_level: enmienda          # one amendment (same target) per chunk; operations stay together
  oversize:
    strategy: deeper_levels_then_recursive
    levels: [operacion]
    # Inserted chapters are long quoted blocks: split them at their own numbered items
    # (quote masking does not apply to oversize cut points).
    extra_split_patterns: ['^\d{1,2}\.\s+[A-ZÁÉÍÓÚÑ]', '^[a-z]\)\s+\S']
  merge_below_tokens: 0          # never merge two amendments: each has its own target
  fold_intro_below_tokens: 80    # "I. Introdúcense ... del Libro III:" is prepended to its first amendment
  include_heading: true
  heading_prefix_template: 'NCG N° {number} ({date}) > {path}'
  preamble: keep
  preamble_heading: 'Encabezado'
# Named extractor instances (one lookup, many outputs for `compendio_target`).
extractors:
  legal_refs:
    # Chilean legal references in the chunk: "D.L. N° 3.500" -> "DL 3500", "Ley N° 21.735" -> "Ley 21735".
    key: regex_labeled
    params:
      rules:
        - {pattern: '\bD\.\s?L\.\s*N[°º]\s*([\d.]+)', label: DL, strip_chars: '.'}
        - {pattern: '\bDecreto\s+Ley\s+N[°º]\s*([\d.]+)', label: DL, strip_chars: '.'}
        - {pattern: '\bD\.\s?F\.\s?L\.\s*N[°º]\s*([\d.]+)', label: DFL, strip_chars: '.'}
        - {pattern: '\bD\.\s?S\.(?:\s+conjunto)?\s+N[°º]\s*(\d+)', label: DS}
        # Not the tail of "Decreto Ley N° 3.500" (that is a DL, already matched above).
        - {pattern: '(?<!Decreto )\b[Ll]ey\s+N[°º]\s*([\d.]+)', label: Ley, strip_chars: '.'}
  vigencia:
    # Effective date of the whole document: the first Spanish date within 700 characters under a
    # VIGENCIA heading, else the first "regirá ... <date>" phrase.
    key: date_after_heading
    params:
      heading_pattern: '^(?:[IVX]{1,4}\.\s*)?VIGENCIA\s*:?\s*$'
      window_chars: 700
      phrase_pattern: '(?:regir[áa]|comenzar[áa]n? a regir|entrar[áa] en vigencia|vigencia a contar)[^.]{0,160}'
      phrase_flags: i
      date:
        pattern: '(\d{1,2})[°º]?\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\s+(?:de|del)\s+(\d{4})'
        flags: i
        day_group: 1
        month_group: 2
        year_group: 3
        months: {enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12}
  # The Compendio target of an amendment is inherited: document title -> part heading -> amendment
  # heading, each layer overriding the previous; text between typographic quotes is the inserted
  # Compendio text (which has its own references), so it is ignored.
  compendio_target:
    key: layered_regex
    params:
      layers: [{field: title}, {group: parte_head}, {group: enmienda_head}]
      strip_quoted: {open: '“', close: '”'}
      max_chars: 260
      require: [libro]
      keys:
        libro: {pattern: '\bLibro\s+([IVX]+)\b', flags: i, upper: true}
        titulo: {pattern: '\bT[ií]tulo\s+([IVXL]+)\b', flags: i, upper: true}
        letra: {pattern: '\bLetra\s+([A-Z](?:\.\d)?)(?=[\s.,])'}
        capitulo: {pattern: '\bCap[ií]tulo\s+([IVXL]+)\b', flags: i, upper: true}
        numero: {pattern: '\bn[uú]mero\s+(\d{1,2}(?:\.\d{1,2})*)(?!\.\d)'}
        anexo: {pattern: '\bAnexo\s+N[°º]\s*(\d+)'}
      # A Letra named without a Chapter in the same layer drops the Chapter/number inherited above.
      reset: [{when: letra, unless: capitulo, clear: [capitulo, numero]}]
  amendment_role:
    key: classify
    params:
      rules:
        - {field: title, pattern: 'MODIFICA|Introd[uú]cense', flags: i, label: amendment}
        - {head_chars: 4000, pattern: 'MODIFICA|Introd[uú]cense', flags: i, label: amendment}
      default: standalone
metadata_fields:
  - {name: source_id,      type: str,  source: 'document:id',        filterable: true}
  - {name: doc_family,     type: str,  source: 'const:ncg',          filterable: true}
  - {name: ncg_number,     type: int,  source: 'document:number',    filterable: true, indexed: true}
  - name: system
    type: str
    source: 'document:subtype'
    transforms: [{key: value_map, params: {map: {NP: SP, NC: SC, NA: IPS}}}]
    filterable: true
  - name: issued_date
    type: date
    source: 'document:date'
    transforms: [{key: date_floor}, {key: reject_after, params: {limit: ingest_date}}]
    filterable: true
    indexed: true
  - {name: effective_from, type: date, source: 'extractor:vigencia', filterable: true}
  - {name: doc_role,       type: str,  source: 'extractor:amendment_role', filterable: true}     # amendment | standalone
  - name: op_verb          # replace/add/delete/modify/insert/...
    type: str
    source: 'group:op_verb'
    transforms:
      - key: prefix_map
        params:
          map:
            reempl: replace
            sustit: replace
            modif: modify
            agreg: add
            incorp: add
            interc: add
            elim: delete
            supr: delete
            derog: repeal
            introd: introduce
            rectif: modify
            renum: renumber
            reenum: renumber
    filterable: true
  - {name: enmienda,       type: str,  source: 'group:enmienda'}
  - {name: target_libro,   type: str,  source: 'extractor:compendio_target.libro',    filterable: true}
  - {name: target_titulo,  type: str,  source: 'extractor:compendio_target.titulo',   filterable: true}
  - {name: target_letra,   type: str,  source: 'extractor:compendio_target.letra',    filterable: true}
  - {name: target_capitulo, type: str, source: 'extractor:compendio_target.capitulo'}
  - {name: target_numero,  type: str,  source: 'extractor:compendio_target.numero'}
  - {name: target_anexo,   type: str,  source: 'extractor:compendio_target.anexo'}
  # Same chapter-level key as compendio.compendio_path -> join NCG <-> Compendio (prefix match when the target is a whole Letra).
  - name: compendio_path
    type: str
    source: 'extractor:template'
    params:
      template: '{system}/L{target_libro}/T{target_titulo}{target_letra?/{target_letra}}{target_capitulo?/C{target_capitulo}}{target_anexo?/AX{target_anexo}}'
      required: [system, target_libro, target_titulo]
    filterable: true
    indexed: true
  - {name: cited_laws,     type: 'list[str]', source: 'extractor:legal_refs', filterable: true}
default_filter: null
reranker_key: none
# Lexical leg: NCG questions cite numbers, dates and legal references ("NCG N° 372") that a lexical
# match pins down.
retrieval_mode: bm25_hybrid  # MRR@10 vs dense, see README
