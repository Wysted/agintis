# Jurisprudence (index doc_type=guia_faq, but 118/120 rows are jurisprudence: 117 "Nota
# Interna N° ..." dictamenes + the "Libro de Jurisprudencia" book). Re-routed by
# title/section (see DESIGN.md). Two document shapes -> two profiles:
#   * this one: the "Libro de Jurisprudencia" (cms-aid-14843) is a thematic INDEX of
#     dictamenes: "7.12.3. Indemnización 8,33%   Of. Ord. N° 9748 de 22-03-10". It is a
#     records document (topic -> oficio references), not prose.
#   * guia_jurisprudencia_nota.yaml: the individual Nota Interna PDFs (not sampled).
# Validated against samples/guia_faq/cms-aid-14843.txt.
key: spensiones_jurisprudencia_indice
schema_version: 1
routing:
  - match: {doc_type: [guia_faq], title: {regex: 'Libro de Jurisprudencia'}}
top_k: 5
chunk_max_tokens: 400
parser_key: simple
cleaners:
  - key: drop_pages_before
    # Cover + prologue (pages 1-2) are not index records; the index starts at a heading.
    params: {pattern: '^\s*[ÍI]NDICE DE CONTENIDOS\s*$', keep_matching_page: true}
  - key: strip_lines
    params: {patterns: ['^\s*\d{1,3}\s*$', '^\s*[ÍI]NDICE DE CONTENIDOS\s*$']}
  - key: join_continuation_lines
    # A record wraps when the topic or the reference list is long. A line that starts
    # with a reference, or that does not start with a record/heading marker, is appended
    # to the previous line.
    params:
      record_start: '^(?:\d{1,2}(?:\.\d{1,2}){0,2}\.?\s|[IVX]{1,4}\.\s|[A-D]\.\s)'
      continuation: '^(?!\d{1,2}(?:\.\d{1,2}){0,2}\.?\s|[IVX]{1,4}\.\s|[A-D]\.\s)\S'
  - key: normalize_whitespace
    params: {collapse_inner_spaces: true, strip_lines: true, max_blank_lines: 1}
chunker_key: records
chunker_params:
  group_levels:
    - name: materia
      pattern: '^(?P<materia>[IVX]{1,4})\.\s+(?P<materia_nombre>[A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ0-9 ,.°º]+)$'
    - name: rama
      pattern: '^(?P<rama>[A-D])\.\s+(?P<rama_nombre>[A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ ,]+)$'
    - name: tema
      pattern: '^(?P<tema>\d{1,2})\.?\s+(?P<tema_nombre>[^\d].*?)\s*(?=(?:Of\.\s*Ord\.|NI)\s*N[°º]|$)'
  record_pattern: '^(?P<topic_num>\d{1,2}(?:\.\d{1,2}){1,2})\.?\s+(?P<topic>.+?)\s*(?P<refs>(?:(?:Of\.\s*Ord\.|NI)\s*N[°º].*)?)$'
  group_by: tema                   # one chunk per tema (all its sub-topics), split if over budget
  header_groups: [materia_nombre, rama_nombre, tema_nombre]
  repeat_group_header: true        # every chunk starts with "materia > rama > tema"
metadata_fields:
  - {name: source_id,   type: str,      source: 'document:id',             filterable: true}
  - {name: doc_family,  type: str,      source: 'const:jurisprudencia',    filterable: true}
  - {name: materia,     type: str,      source: 'group:materia_nombre',    filterable: true}
  - {name: tema,        type: str,      source: 'group:tema_nombre',       filterable: true}
  - name: oficio_refs
    type: 'list[str]'
    source: 'extractor:regex_all'
    params: {pattern: '((?:Of\.\s*Ord\.|NI)\s*N[°º]\s*[\w.\-]+(?:\s*-?SA)?\s+(?:de\s+)?\d{1,2}\s*[-.]\s*\d{2}\s*[-.]\s*\d{2,4})', group: 1, normalize: compact_spaces}
    filterable: true
  - {name: book_date,   type: date,     source: 'document:last_modified_hint'}
default_filter: null
reranker_key: none
# bm25_hybrid is available opt-in; measured but not adopted, see README.
