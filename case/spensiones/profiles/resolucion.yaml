# Resoluciones (index doc_type=resolucion 281 rows + 6 articulo_html rows titled
# "Resolución Exenta ..."). The sample (cms-aid-17157) is a browser print-to-PDF with
# 4 image-only pages and 0 extractable characters: the existing `simple` parser raises
# ScannedDocumentError. This profile ingests the index card only (title + description from
# the crawler row) as ONE chunk, so resolutions are findable and citable by number/date.
# OCR is available opt-in (`parser_key: ocr_index_card` + the `ocr` uv extra). It was measured
# here and not adopted: a card-snippet question dropped from rank 1 to 3 (dense MRR@10 fell
# 0.79 -> 0.78), although in-res-30's body answer became retrievable.
# Body layout (VISTOS / CONSIDERANDO / RESUELVO) is the standard Chilean administrative
# act; NOT validated (sample has no text).
key: spensiones_resolucion
schema_version: 1
# Status: the index-card mode is validated; the OCR mode was measured and not adopted.
routing:
  - match: {doc_type: [resolucion]}
  # Narrower than the generic article rule of articulo_faq: higher priority wins.
  - match: {doc_type: [articulo_html], title: {regex: '^\s*Resoluci[oó]n (?:Exenta|N)'}}
    priority: 10
top_k: 5
chunk_max_tokens: 600
# `simple_index_card` = `simple`, but a scanned PDF falls back to the index card (title +
# description of the document metadata) and reports `parsed:content_mode`.
parser_key: simple_index_card
cleaners:
  - key: strip_repeated_page_lines
    params: {zone_lines_top: 4, zone_lines_bottom: 4, min_page_ratio: 0.5, min_pages: 2, normalize_digits: true}
  - key: strip_lines
    # Browser print artefacts: URL/date/page counters in the margins.
    params: {patterns: ['^\s*\d{1,3}\s*(?:/|de)\s*\d{1,3}\s*$', '^https?://\S+\s*$', '^\d{1,2}/\d{1,2}/\d{2,4},?\s+\d{1,2}:\d{2}']}
  - key: normalize_whitespace
    params: {collapse_inner_spaces: true, strip_lines: true, max_blank_lines: 1}
chunker_key: pattern_hierarchy
chunker_params:
  levels:
    - name: bloque
      depth: 0
      pattern: '^(?P<bloque>VISTOS?|CONSIDERANDO|RESUELVO|TENIENDO PRESENTE)\s*[:.]?\s*'
      heading_template: '{bloque}'
    - name: numero
      depth: 1
      pattern: '^(?P<numero>\d{1,2})[°º.)]-?\s+\S'
      heading_template: '{numero}'
  split_level: bloque
  oversize: {strategy: deeper_levels_then_recursive, levels: [numero]}
  merge_below_tokens: 80
  include_heading: true
  heading_prefix_template: 'Resolución N° {number} ({date})'
  preamble: keep
  preamble_heading: 'Encabezado'
metadata_fields:
  - {name: source_id,    type: str,  source: 'document:id',          filterable: true}
  - {name: doc_family,   type: str,  source: 'const:resolucion',     filterable: true}
  - {name: resolution_number, type: int, source: 'document:number',  filterable: true, indexed: true}
  - name: issued_date
    type: date
    source: 'document:date'
    transforms: [{key: date_floor}, {key: reject_after, params: {limit: ingest_date}}]
    filterable: true
    indexed: true
  - name: audiences
    type: 'list[str]'
    source: 'document:section'
    transforms: [{key: path_segment, params: {take: last}}]
    filterable: true
  - {name: content_mode, type: str,  source: 'parsed:content_mode',  filterable: true}   # full_text | index_card
  - name: topic_class     # normativa | institucional | lobby
    type: str
    source: 'extractor:classify'
    params:
      rules:
        - {field: section, pattern: 'Lobby', label: lobby}
        - {field: section, pattern: 'Normativa del', label: normativa}
      default: institucional
    filterable: true
default_filter: null
reranker_key: none
