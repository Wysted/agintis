# CMS article pages (index doc_type=articulo_html, html_only=true). 130 of 210 titles are
# questions (FAQ: one question, one short answer); the rest are topical guide pages
# ("Pensión de sobrevivencia", "Desafiliación") with bold sub-headings. 6 rows titled
# "Resolución Exenta N° ..." are re-routed to the resolucion profile by routing priority.
# Validated against samples/articulos_html/cms-aid-3590.html.
key: spensiones_articulo_faq
schema_version: 1
routing:
  # Broad rule (priority 0): the narrower article rules (resolucion, jurisprudencia_nota, priority
  # 10) outrank it, so no `exclude` is needed here.
  - match: {doc_type: [articulo_html]}
    priority: 0
top_k: 5
chunk_max_tokens: 512
parser_key: simple
cleaners:
  - key: html_main_content
    # DOM-level boilerplate removal (Newtenberg CMS). Everything outside the selected
    # boxes (menus, glossary, footer, "Otras preguntas relacionadas") is dropped.
    params:
      title_selector: '#article_i__SP_ar_articulo_titulo_1 h1'
      include_selectors: ['#article_i__SP_ar_articulo_resumen_y_cuerpo_1']
      exclude_selectors: ['[style*="display:none"]', 'script', 'style', '.botones-texto']
      # <p><strong>Sub-heading</strong></p> (whole paragraph bold) becomes a heading, so
      # a long guide page can be cut by topic.
      bold_paragraph_as_heading: true
      heading_selectors: ['h2', 'h3', 'h4']
      list_item_prefix: '- '
      output: markdown
  - key: html_collect
    # Document-level values the metadata reads as `parsed:<key>`.
    params:
      fields:
        keywords: {selector: '#article_i__SP_ar_articulo_resumen_y_cuerpo_1 [style*="display:none"]', split: ','}
        related_aids: {selector: '#lista_articulos_i__SP_ar_articulo_otras_faq_1 a', attr: href, regex: 'w3-article-(\d+)\.html'}
  - key: normalize_whitespace
    params: {collapse_inner_spaces: true, strip_lines: true, max_blank_lines: 1}
chunker_key: whole_document        # an FAQ is one chunk; a longer guide page falls back to `structured`
chunker_params:
  include_heading: true            # the question / page title is the heading of every chunk
metadata_fields:
  - {name: source_id,     type: str,      source: 'document:id',      filterable: true}
  - {name: doc_family,    type: str,      source: 'const:articulo_faq', filterable: true}
  - {name: aid,           type: int,      source: 'document:aid',     filterable: true}
  - {name: area,          type: str,      source: 'document:area',    filterable: true}
  - name: audiences
    type: 'list[str]'
    source: 'document:section'
    transforms: [{key: path_segment, params: {take: last}}]
    filterable: true
  - name: is_question       # "yes"/"no" (bool values are rejected as metadata)
    type: str
    source: 'extractor:classify'
    params: {rules: [{field: title, pattern: '\?\s*$', label: 'yes'}], default: 'no'}
    filterable: true
  - {name: keywords,      type: 'list[str]', source: 'parsed:keywords',  filterable: true}
  - {name: related_aids,  type: 'list[int]', source: 'parsed:related_aids'}
  - {name: last_modified, type: date,     source: 'document:last_modified_hint'}
default_filter: null
reranker_key: none
# bm25_hybrid measured, not adopted (old dev set -0.0116 isolated), see README.
