# Compendio de Normas del Sistema de Pensiones / Seguro de Cesantia (consolidated norm).
# Input: one PDF per Libro (index doc_type=compendio_libro, 10 rows). The 113
# compendio_titulo HTML rows are navigation hubs (glossary + links, no normative body):
# they are NOT ingested (see DESIGN.md).
# Validated against samples/compendio/compendio-sp-libro-i.txt (453 pages).
key: spensiones_compendio
schema_version: 1
routing:
  - match: {doc_type: [compendio_libro]}
top_k: 6
chunk_max_tokens: 700
parser_key: simple            # FOP-generated PDFs have a clean text layer
cleaners:
  - key: drop_toc_pages
    params:
      leader_pattern: '\.{4,}\s*\d+\s*$'
      min_leader_ratio: 0.2       # share of non-empty lines ending in dot leaders + page no.
      max_scan_pages: 15
  - key: strip_running_headers
    params:
      zone: top
      max_lines: 1
      patterns: ['^Compendio de Normas del (?:Sistema de Pensiones|Seguro de Cesant[ií]a)\s*-\s*Libro [IVX]+\.?\s*\d+\s*$']
  - key: dedupe_heading_echo
    # FOP prints every heading twice (short bookmark form, possibly wrapped, then the
    # full title). Drop the first echo plus its wrapped continuation lines.
    params:
      # Key is normalised (dots/spaces removed) so the TOC-style typo "Capítulo. I X"
      # pairs with "Capítulo I. X".
      # Numbered section headings ("4. Afiliación de trabajadores ...") are echoed too.
      pattern: '^(?P<key>Cap[ií]tulo\.?\s*[IVXL]+\b|Anexo(?: N[º°])?\s*(?:[IVX]+|\d+[A-Z]?)?\b|\d{1,2}\.(?!\d))'
      key_normalize: strip_dots_spaces
      window_lines: 6            # long annex titles wrap over up to 4 lines before the full echo
  - key: normalize_whitespace
    params: {collapse_inner_spaces: true, strip_lines: true, max_blank_lines: 1}
chunker_key: pattern_hierarchy
chunker_params:
  levels:
    - name: seccion
      depth: 0
      # Breadcrumb printed at the start of each section page: Titulo / Letra / Anexos.
      pattern: '^Libro (?P<bc_libro>[IVX]+)\.?, T[ií]tulo (?P<titulo>[IVXL]+)\.?(?:, Letra (?P<letra>[A-Z](?:\.\d)?))?(?:, Cap[ií]tulo (?P<bc_capitulo>[IVXL]+))?(?P<anexos>, Anexos)?(?:,?\s+(?P<seccion_nombre>\S.*?))?\s*$'
      heading_template: 'Título {titulo}{letra?, Letra {letra}}{seccion_nombre? {seccion_nombre:70}}'
      role: context              # sets Título/Letra for what follows; repeated on every section page
      reset_on_change: [titulo, letra, anexos]   # closes the open Capítulo only when these change
      keep_heading_line: false   # the breadcrumb line is excised from chunk text (it is in the path)
    - name: capitulo
      depth: 1
      # The guard rejects cross-references wrapped to a line start ("Capítulo V. Recaudación,
      # de la presente Letra A, podrá ...").
      pattern: '^(?!.*\b(?:de la presente|del presente|de este|de esta|podrá|deberá|se refiere)\b)Cap[ií]tulo (?P<capitulo>[IVXL]+)\.\s+(?P<capitulo_nombre>\S.*)$'
      heading_template: 'Capítulo {capitulo}. {capitulo_nombre}'
    - name: anexo
      depth: 1
      # Guard rejects body lines that start with a reference ("Anexo I de este Título, ...");
      # names may contain commas/colons ("Anexo Nº 6 Distribución de Saldos, Cotizaciones ...").
      pattern: '^(?!.*\b(?:de este|de esta|del presente|de la presente|que indique|se refiere)\b)Anexo(?: N[º°])?\s*(?P<anexo>[IVX]+|\d+[A-Z]?)?\b\s*(?P<anexo_nombre>[^.;]*[^.;\s])?\s*$'
      heading_template: 'Anexo {anexo}{anexo_nombre? {anexo_nombre}}'
    - name: numero
      depth: 2
      # Guard: a wrapped cross-reference ("... el número\n45. anterior.") is not an item.
      pattern: '^(?P<numero>\d{1,2})\.(?!\d)\s+(?!(?:anterior|precedente|siguiente)\b)\S'
      heading_template: '{numero}.'
    - name: subnumero
      depth: 3
      pattern: '^(?P<subnumero>\d{1,2}\.\d{1,2})\.?\s+\S'
      heading_template: '{subnumero}'
    - name: literal
      depth: 4
      pattern: '^(?P<literal>[a-zñ])\)\s+\S'
      heading_template: '{literal})'
  split_level: numero            # unit = numbered item; capitulo/anexo intro text = own chunk
  oversize: {strategy: deeper_levels_then_recursive, levels: [subnumero, literal]}
  merge_below_tokens: 60         # tiny unit merged into the NEXT unit of the same level and parent (keeps all numeros)
  fold_intro_below_tokens: 80    # short Capítulo intro (heading + sub-heading) is prepended to its first child
  include_heading: true
  heading_prefix_template: 'Compendio {area} Libro {number} > {path}'   # area / number = index row
  preamble: drop                 # text before the first breadcrumb is TOC residue
extractors:
  legal_refs:
    # Chilean legal references in the chunk: "D.L. N° 3.500" -> "DL 3500", "Ley N° 21.735" -> "Ley 21735".
    key: regex_labeled
    params:
      rules:
        - {pattern: '\bD\.\s?L\.\s*N[°º]\s*([\d.]+)', label: DL, strip_chars: '.'}
        - {pattern: '\bDecreto\s+Ley\s+N[°º]\s*([\d.]+)', label: DL, strip_chars: '.'}
        - {pattern: '\bD\.\s?F\.\s?L\.\s*N[°º]\s*([\d.]+)', label: DFL, strip_chars: '.'}
        - {pattern: '\bD\.\s?S\.(?:\s+conjunto)?\s+N[°º]\s*(\d+)', label: DS}
        # Not the tail of "Decreto Ley N° 3.500" (that is a DL, already matched above).
        - {pattern: '(?<!Decreto )\b[Ll]ey\s+N[°º]\s*([\d.]+)', label: Ley, strip_chars: '.'}
metadata_fields:
  - {name: source_id,      type: str,  source: 'document:id',          filterable: true}
  - {name: doc_family,     type: str,  source: 'const:compendio',      filterable: true}
  - name: system
    type: str
    source: 'document:area'
    transforms: [{key: value_map, params: {map: {pensiones: SP, cesantia: SC}}}]
    filterable: true
  - {name: libro,          type: str,  source: 'document:number',      filterable: true}
  - {name: titulo,         type: str,  source: 'group:titulo',         filterable: true}
  - {name: letra,          type: str,  source: 'group:letra',          filterable: true}
  - {name: capitulo,       type: str,  source: 'group:capitulo',       filterable: true}
  - {name: capitulo_nombre, type: str, source: 'group:capitulo_nombre'}
  - {name: anexo,          type: str,  source: 'group:anexo',          filterable: true}
  - {name: numeros,        type: 'list[str]', source: 'group:numero',  filterable: true}   # list: merged chunks cover several items
  # Chapter-level join key shared with ncg.compendio_path: SP/LI/TIII/A/CV  (system/Libro/Título/Letra/Capítulo|AXanexo)
  - name: compendio_path
    type: str
    source: 'extractor:template'
    params:
      template: '{system}/L{libro}/T{titulo}{letra?/{letra}}{capitulo?/C{capitulo}}{anexo?/AX{anexo}}'
      required: [system, libro, titulo]
    filterable: true
    indexed: true
  # NCG numbers named in "Nota de actualizacion: ... Norma de Caracter General N 31": reverse link to the NCG history.
  - name: amended_by_ncg
    type: 'list[int]'
    source: 'extractor:regex_all'
    params: {pattern: 'Norma de\s+Car[aá]cter\s+General\s+N[º°]\s*(\d+)', group: 1, unique: true}
    filterable: true
  - {name: cited_laws,     type: 'list[str]', source: 'extractor:legal_refs', filterable: true}
  - {name: validity,       type: str,  source: 'const:consolidated_current', filterable: true}
default_filter: null
reranker_key: none
# Hybrid: the compendio is a numbered legal text (Libro/Titulo/Letra/Capitulo/numero). Exact
# terms ("afiliacion automatica", ncg numbers) are lost by dense embeddings. Measured on the
# eval questions: hit@1 0.64 -> 0.73, MRR 0.70 -> 0.76, no question got worse.
retrieval_mode: hybrid
# bm25_hybrid is available opt-in; measured but not adopted, see README.
