# LLM prices in USD per 1M tokens, versioned by effective date (see platform/usage/prices.py).
# A model missing here is reported as UNPRICED, never as $0. Prices are read at report time, so
# fixing a value re-prices the whole history; add a NEW entry when a provider changes its prices.
#
# PLACEHOLDER VALUES: every number below must be verified against the provider's price page
# before the figures are used for anything but a rough estimate.
models:
  gpt-6-luna:
    # List price recorded in the spensiones calibration notes ($0.10 in / $0.50 out).
    # TODO-verify: cached_input is NOT documented in the repo; it is set equal to `input`
    # (no cache discount), which over-estimates.
    - effective_from: 2026-10-01
      input: 0.10
      cached_input: 0.10
      output: 0.50

