# LLM prices in USD per 1M tokens, versioned by effective date (see platform/usage/prices.py).
# A model missing here is reported as UNPRICED, never as $0. Prices are read at report time, so
# fixing a value re-prices the whole history; add a NEW entry when a provider changes its prices.
# Only standard synchronous rates are modelled: no batch/flex/priority tiers, no long-context
# surcharges, no time-of-day discounts.
models:
  gpt-6-luna:
    # Source: developers.openai.com/api/docs/pricing (standard tier), verified 2026-10-24.
    # The page states no effective date. Not modelled: prompts over 272K input tokens cost
    # 2x input/cached and 1.5x output.
    - effective_from: 2026-10-01
      input: 0.10
      cached_input: 0.01
      output: 0.50

  gpt-5.4-mini:
    # Source: developers.openai.com/api/docs/pricing (standard tier), verified 2026-10-24.
    # The page states no effective date.
    - effective_from: 2026-10-01
      input: 0.75
      cached_input: 0.075
      output: 4.50

  deepseek-flash:
    # Source: api-docs.deepseek.com/quick_start/pricing.
    # PEAK rates (upper bound): off-peak is half, outside 01-04 and 06-10 UTC on weekdays.
    - effective_from: 2026-09-10
      input: 0.30
      cached_input: 0.006
      output: 1.20

  deepseek-chat:
    # Legacy name served as deepseek-flash (same price, same peak-rate caveat).
    - effective_from: 2026-09-10
      input: 0.30
      cached_input: 0.006
      output: 1.20
